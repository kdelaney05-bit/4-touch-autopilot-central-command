<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ride-Along</title>
<link rel="icon" href="../favicon.svg">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #0b0d10; color: #eef0ec; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 14px 16px 40px; }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .top a { color: #c9962b; text-decoration: none; font-weight: 700; }
  h1 { font-size: 18px; margin: 0; font-weight: 700; }
  video { width: 100%; max-height: 78vh; background: #000; border-radius: 12px; display: block; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .btn { border: 1px solid #3a3f47; background: #171a1f; color: #eef0ec; border-radius: 9px; padding: 8px 12px; font-weight: 700; text-decoration: none; font-size: 13px; cursor: pointer; }
  .btn.on { background: #c9962b; color: #1c1a15; border-color: #c9962b; }
  .meta { color: #8a8f98; font-size: 12.5px; margin-left: auto; }
  .note { color: #8a8f98; font-size: 13px; margin-top: 12px; line-height: 1.45; }
  .note b { color: #eef0ec; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="ride-alongs.html">‹ All the Ride-Alongs</a><h1 id="t">Ride-Along</h1></div>
  <video id="v" controls playsinline preload="metadata" autoplay></video>
  <div class="row">
    <span style="color:#8a8f98;font-size:12.5px">Speed</span>
    <button class="btn on" data-s="1">1×</button><button class="btn" data-s="1.25">1.25×</button><button class="btn" data-s="1.5">1.5×</button>
    <a class="btn" id="dl" href="#" download>Save the file</a>
    <span class="meta" id="m"></span>
  </div>
  <p class="note">Sound on. If it does not start, tap the picture once. <b>On a phone</b> turn it sideways for the full screen. Nothing here is real and nothing is saved.</p>
</div>
<script>
  const NAMES = {
    'ride-along-the-invoice': 'Laura · Jess · The Invoice',
    'ride-along-the-bills': 'Jonathan · The Bills',
    'ride-along-what-youre-getting': "The sales team · Where you were, what you're getting",
    'ride-along-put-it-to-bed': 'Everyone · Put it to bed',
    'ride-along-tell-the-team': 'Everyone · Tell the Team',
    'supervisor-app': 'The supervisor app · the real screens',
    'ride-along-the-paperwork': 'Gio · The paperwork, signature to permit',
  };
  const f = (new URLSearchParams(location.search).get('f') || '').replace(/[^a-z0-9-]/gi, '');
  const v = document.getElementById('v');
  if (!f) { document.getElementById('t').textContent = 'Pick a film from the list.'; v.remove(); }
  else {
    const src = '../films/' + f + '.mp4';
    v.src = src; document.getElementById('dl').href = src;
    document.title = (NAMES[f] || f) + ' · Ride-Along';
    document.getElementById('t').textContent = NAMES[f] || f;
    v.addEventListener('loadedmetadata', () => { const s = Math.round(v.duration); document.getElementById('m').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); });
    v.addEventListener('error', () => { document.getElementById('m').textContent = 'This film is not on the site yet. Tell Kevin which one.'; });
    v.play().catch(() => {});   // phones want a tap first; the controls are right there
  }
  document.querySelectorAll('[data-s]').forEach((b) => b.addEventListener('click', () => { v.playbackRate = Number(b.dataset.s); document.querySelectorAll('[data-s]').forEach((x) => x.classList.toggle('on', x === b)); }));
</script>
</body>
</html>
